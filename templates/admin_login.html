<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css">

    <style>

        body {
            font-family: Arial;
            background: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;

            position: relative;
        }

        .page-logo {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);

            font-size: 54px;
            font-weight: 900;
            letter-spacing: 4px;

            color: #007bff;
        }

        .box {
            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 0 10px gray;

            width: 300px;

            text-align: center;
        }

        h2 {
            color: #333;
            margin-top: 0;
        }

        input {
            width: 90%;

            padding: 10px;

            margin: 10px 0;

            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;

            background: #007bff;
            color: white;

            border: none;
            border-radius: 5px;

            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .message {
            color: green;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .error {
            color: red;
            font-weight: bold;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

    <!-- Brand Name -->
    <div class="page-logo">
        📚 BOOKNEST
    </div>

    <!-- Login Box -->
    <div class="box">

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <p id="messageBox" class="message">
                    {{ messages[0] }}
                </p>
            {% endif %}
        {% endwith %}

        <h2>Admin Login</h2>

        <form action="/admin_login" method="POST">

            <input 
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input 
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p style="
            margin-top: 15px;
            color: gray;
            font-size: 14px;
            line-height: 1.6;
        ">
            Demo Login:<br>
            Username: <b>admin</b><br>
            Password: <b>admin123</b>
        </p>

    </div>

    <script>

        // Hide message after 2 seconds
        setTimeout(function() {

            let msg = document.getElementById("messageBox");

            if(msg){
                msg.style.display = "none";
            }

        }, 2000);

    </script>

</body>
</html>
