<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Analytics Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      font-family: Arial;
      box-sizing: border-box;
    }

    body {
      display: flex;
      background: #f4f6f9;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: #0d1b2a;
      color: white;
      padding: 20px;
    }

    .sidebar h2 {
      color: #4ea8de;
      margin-bottom: 20px;
    }

    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 6px;
    }

    .sidebar a:hover {
      background: #1b263b;
    }

    /* Main */
    .main {
      flex: 1;
      padding: 25px;
    }

    .title {
      font-size: 24px;
      margin-bottom: 20px;
      color: #222;
    }

    /* Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .card h3 {
      font-size: 14px;
      color: #666;
    }

    .card .value {
      font-size: 20px;
      font-weight: bold;
      color: #007bff;
      margin-top: 8px;
    }

    /* Chart */
    .chart-box {
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .chart-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-top: 20px;
    }

    .chart-box.small {
    padding: 15px;
    }

    .chart-box.small canvas {
    max-height: 220px;
    }

    .chart-box canvas {
    width: 100%;
    height: 250px;
    }

    h1 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
    }

  </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2>📚 BOOKNEST</h2>
  <a href="/dashboard">Home</a>
  <a href="/books">Books</a>
  <a href="/customers">Customers</a>
  <a href="/orders">Orders</a>
  <a href="/analytics">Analytics</a>
</div>

<!-- Main -->
<div class="main">

  <h1>📈 Analytics Dashboard</h1>

  <!-- FILTER-->
  
  <!-- Cards -->
  <div class="grid">

  <div class="card">
    <h3>📦 Total Orders</h3>
    <div class="value">{{ stats[0] if stats else 0 }}</div>
  </div>

  <div class="card">
    <h3>💰 Total Revenue</h3>
    <div class="value">₹ {{ stats[1] if stats else 0 }}</div>
  </div>

  <div class="card">
    <h3>📊 Avg Order Value</h3>
    <div class="value">₹ {{ stats[2] if stats else 0 }}</div>
  </div>

</div>

  <!-- Chart -->

<div class="chart-grid">

  <div class="chart-box">
    <h3>📊 Monthly Sales</h3>
    <canvas id="salesChart"></canvas>
  </div>

  <div class="chart-box small">
  <h3>📚 Top Books</h3>
  <canvas id="booksChart"></canvas>
  </div>

  <div class="chart-box small">
  <h3>👤 Top Customers</h3>
  <canvas id="customersChart"></canvas>
  </div>

  <div class="chart-box small">
  <h3>🥧 Genre Distribution</h3>
  <canvas id="genreChart"></canvas>
  </div>

</div>

<!-- JSON DATA  -->
<script id="sales-data" type="application/json">
  {{ [] | tojson }}
</script>

<script id="books-data" type="application/json">
  {{ [] | tojson }}
</script>

<script id="customers-data" type="application/json">
  {{ [] | tojson }}
</script>

<script id="genre-data" type="application/json">
  {{ [] | tojson }}
</script>

<!-- Chart Script -->
<script>
  const salesData = JSON.parse(document.getElementById("sales-data").textContent);

  const salesLabels = salesData.map(i => i.month);
  const salesValues = salesData.map(i => i.sales);

  new Chart(document.getElementById("salesChart"), {
    type: 'line',
    data: {
      labels: salesLabels,
      datasets: [{
        label: 'Monthly Sales',
        data: salesValues,
        borderColor: 'blue',
        fill: false,
        tension: 0.3
      }]
    }
  });

  const booksData = JSON.parse(document.getElementById("books-data").textContent);

  const bookLabels = booksData.map(i => i[0]);
  const bookValues = booksData.map(i => i[1]);

  new Chart(document.getElementById("booksChart"), {
    type: 'bar',
    data: {
      labels: bookLabels,
      datasets: [{
        label: 'Top Books',
        data: bookValues,
        backgroundColor: 'green'
      }]
    }
  });

  const customerData = JSON.parse(document.getElementById("customers-data").textContent);

  const customerLabels = customerData.map(i => i[0]);
  const customerValues = customerData.map(i => i[1]);

  new Chart(document.getElementById("customersChart"), {
    type: 'bar',
    data: {
      labels: customerLabels,
      datasets: [{
        label: 'Top Customers',
        data: customerValues,
        backgroundColor: 'orange'
      }]
    }
  });

  const genreData = JSON.parse(
  document.getElementById("genre-data").textContent
  );

  const genreLabels = genreData.map(i => i[0]);
  const genreValues = genreData.map(i => i[1]);

  const total = genreValues.reduce((a, b) => a + b, 0);

  new Chart(document.getElementById("genreChart"), {
    type: 'pie',
    data: {
      labels: genreLabels,
      datasets: [{
        data: genreValues
      }]
    },
    options: {
      plugins: {
        datalabels: {
          color: 'white',
          formatter: (value) => {
            return ((value / total) * 100).toFixed(1) + "%";
          }
        }
      }
    },
    plugins: [ChartDataLabels]
  });

</script>

</body>
</html>
